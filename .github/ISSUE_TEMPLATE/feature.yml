name: Feature request
description: Something the tool should be able to do and can't
labels: ['enhancement']
body:
  - type: markdown
    attributes:
      value: |
        Pushdown automata, Turing machines and context-free grammars are already tracked and
        deliberately out of scope for v1 — please add to those issues rather than opening a
        new one. Everything else is open.

  - type: textarea
    id: problem
    attributes:
      label: What are you trying to do
      description: The task, not the feature. What you're working around tells me more than
        a description of the button you want, and sometimes there's already a way.
      placeholder: |
        I'm setting a problem sheet and need the same DFA at four different stages of
        minimization, as four separate figures.
    validations:
      required: true

  - type: textarea
    id: idea
    attributes:
      label: What you have in mind
      description: Optional. If you have a specific shape for it, say so.

  - type: dropdown
    id: who
    attributes:
      label: Are you
      options:
        - A student
        - An instructor or TA
        - Neither / prefer not to say
      description: Only so I know whose problem it is. It changes the answer more than you'd
        expect.
