name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  deploy:
    name: Cloudflare Pages
    runs-on: ubuntu-latest
    # Without the secrets this job cannot do anything, and a red X on every push to main
    # trains you to ignore the CI badge. It skips cleanly until DECISION D10 is resolved
    # and the two secrets exist.
    if: ${{ github.repository == 'PranavShukla2/kleene' }}
    steps:
      - uses: actions/checkout@v4

      - name: Check for Cloudflare credentials
        id: creds
        run: |
          if [ -n "${{ secrets.CLOUDFLARE_API_TOKEN }}" ] && [ -n "${{ secrets.CLOUDFLARE_ACCOUNT_ID }}" ]; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "present=false" >> "$GITHUB_OUTPUT"
            echo "::notice title=Deploy skipped::CLOUDFLARE_API_TOKEN / CLOUDFLARE_ACCOUNT_ID are not set. See docs/plan/DECISIONS.md D10."
          fi

      - uses: Swatinem/rust-cache@v2
        if: steps.creds.outputs.present == 'true'

      - uses: jetli/wasm-pack-action@v0.4.0
        if: steps.creds.outputs.present == 'true'
        with:
          version: 'v0.15.0'

      - uses: actions/setup-node@v4
        if: steps.creds.outputs.present == 'true'
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Build
        if: steps.creds.outputs.present == 'true'
        run: |
          wasm-pack build crates/kleene-wasm --target web --out-dir pkg --release
          node scripts/check-wasm-size.mjs
          cd web && npm ci && npx tsc -b --noEmit && npx vite build

      - name: Publish
        if: steps.creds.outputs.present == 'true'
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy web/dist --project-name=kleene
