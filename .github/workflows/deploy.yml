name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  deploy:
    name: Cloudflare Pages
    runs-on: ubuntu-latest
    # Without the secrets this job cannot do anything, and a red X on every push to main
    # trains you to ignore the CI badge. It skips cleanly until DECISION D10 is resolved
    # and the two secrets exist.
    if: ${{ github.repository == 'PranavShukla2/kleene' }}
    steps:
      - uses: actions/checkout@v4

      - name: Check for Cloudflare credentials
        id: creds
        run: |
          if [ -n "${{ secrets.CLOUDFLARE_API_TOKEN }}" ] && [ -n "${{ secrets.CLOUDFLARE_ACCOUNT_ID }}" ]; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "present=false" >> "$GITHUB_OUTPUT"
            echo "::notice title=Deploy skipped::CLOUDFLARE_API_TOKEN / CLOUDFLARE_ACCOUNT_ID are not set. See docs/plan/DECISIONS.md D10."
          fi

      - uses: Swatinem/rust-cache@v2
        if: steps.creds.outputs.present == 'true'

      - uses: jetli/wasm-pack-action@v0.4.0
        if: steps.creds.outputs.present == 'true'
        with:
          version: 'v0.15.0'

      - uses: actions/setup-node@v4
        if: steps.creds.outputs.present == 'true'
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Build
        if: steps.creds.outputs.present == 'true'
        run: |
          wasm-pack build crates/kleene-wasm --target web --out-dir pkg --release
          node scripts/check-wasm-size.mjs
          cd web && npm ci && npx tsc -b --noEmit && npx vite build

      # Creating the project from the workflow rather than by hand in the dashboard, so
      # the repository is self-bootstrapping: a fork, or a rebuild after the project is
      # deleted, needs only the two secrets and no setup steps written down somewhere.
      # Idempotent — it checks before creating.
      - name: Ensure the Pages project exists
        if: steps.creds.outputs.present == 'true'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if npx --yes wrangler@3 pages project list | grep -qw 'kleene'; then
            echo "Pages project 'kleene' already exists."
          else
            echo "Creating Pages project 'kleene'."
            npx --yes wrangler@3 pages project create kleene --production-branch=main
          fi

      - name: Publish
        if: steps.creds.outputs.present == 'true'
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          # --commit-dirty: the build writes web/dist and the wasm pkg/, both gitignored,
          # but wrangler still reports a dirty tree and warns. In CI the tree is dirty by
          # construction, so the warning carries no information.
          command: pages deploy web/dist --project-name=kleene --commit-dirty=true
