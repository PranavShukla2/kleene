name: Release

# Tag-driven: `git tag v1.0.0 && git push --tags` builds and packages everything. No step of
# the build needs a human, because a build with a manual step is a build that gets done
# differently each time. The one deliberate human step is at the end — the release is created
# as a draft, so the notes get read before anyone else does.
on:
  push:
    tags: ['v*']
  # Buildable without tagging, so a change to this file can be proved before it is the only
  # thing standing between a tag and a release.
  workflow_dispatch:

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  # The tag says what version this is; Cargo.toml says what version the code is. If they
  # disagree, the artefacts are mislabelled and nothing downstream can tell. Cheap to check,
  # and it runs before anything spends twenty minutes cross-compiling.
  check:
    name: The tag matches the manifest
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Compare
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          tag="${GITHUB_REF#refs/tags/v}"
          manifest="$(grep -m1 '^version' Cargo.toml | cut -d'"' -f2)"
          if [ "$tag" != "$manifest" ]; then
            echo "::error::Tag v$tag does not match the workspace version $manifest."
            echo "Bump Cargo.toml, or retag."
            exit 1
          fi
          echo "v$tag matches the manifest."

  cli:
    name: CLI · ${{ matrix.target }}
    needs: check
    runs-on: ${{ matrix.os }}
    strategy:
      # One target failing should not deny the other two their artefacts — a release with two
      # of three binaries is worth shipping while the third is fixed.
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-latest
          - target: aarch64-apple-darwin
            os: macos-latest
          - target: x86_64-pc-windows-msvc
            os: windows-latest

    steps:
      - uses: actions/checkout@v4

      - name: Add the target
        run: rustup target add ${{ matrix.target }}

      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}

      - name: Build
        run: cargo build --release --locked -p kleene-cli --target ${{ matrix.target }}

      # Archived per-platform convention: a tarball on Unix, a zip on Windows, each holding
      # the binary and the licences. Named with the target triple so someone downloading three
      # of them can tell which is which.
      - name: Package (Unix)
        if: matrix.os != 'windows-latest'
        run: |
          staging="kleene-${{ matrix.target }}"
          mkdir "$staging"
          cp "target/${{ matrix.target }}/release/kleene" "$staging/"
          cp README.md LICENSE-MIT LICENSE-APACHE "$staging/"
          tar czf "$staging.tar.gz" "$staging"

      - name: Package (Windows)
        if: matrix.os == 'windows-latest'
        shell: pwsh
        run: |
          $staging = "kleene-${{ matrix.target }}"
          New-Item -ItemType Directory -Path $staging | Out-Null
          Copy-Item "target/${{ matrix.target }}/release/kleene.exe" $staging
          Copy-Item README.md, LICENSE-MIT, LICENSE-APACHE $staging
          Compress-Archive -Path $staging -DestinationPath "$staging.zip"

      - uses: actions/upload-artifact@v4
        with:
          name: kleene-${{ matrix.target }}
          path: |
            kleene-*.tar.gz
            kleene-*.zip
          if-no-files-found: error

  # The web app is deployed by deploy.yml on every push to main, so it is not re-deployed
  # here. What this adds is a downloadable copy of exactly what a given tag served — the
  # thing a department that cannot rely on a URL staying up actually needs.
  web:
    name: Web bundle
    needs: check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: Swatinem/rust-cache@v2

      - uses: jetli/wasm-pack-action@v0.4.0
        with:
          # The same pin as ci.yml and deploy.yml, and for the same reason: wasm-pack ships
          # its own binaryen, and the wasm-opt flags in crates/kleene-wasm/Cargo.toml are
          # only valid for the version it bundles. Three workflows building the same module
          # with two different toolchains is a bug waiting for a release to expose it.
          version: 'v0.15.0'

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install
        working-directory: web
        run: npm ci

      - name: Build
        working-directory: web
        run: npm run build

      - name: Package
        run: tar czf kleene-web.tar.gz -C web dist

      - uses: actions/upload-artifact@v4
        with:
          name: kleene-web
          path: kleene-web.tar.gz
          if-no-files-found: error

  desktop:
    name: Desktop · ${{ matrix.name }}
    needs: check
    runs-on: ${{ matrix.os }}
    strategy:
      # As with the CLI: one platform failing should not deny the other two their bundles.
      fail-fast: false
      matrix:
        include:
          - name: macOS (Apple silicon)
            os: macos-latest
            args: --target aarch64-apple-darwin
          - name: Windows
            os: windows-latest
            args: ""
          - name: Linux
            os: ubuntu-22.04
            args: ""

    steps:
      - uses: actions/checkout@v4

      # 22.04 rather than latest, deliberately. A Tauri build links against the system
      # webkit2gtk, and a .deb built on a newer glibc refuses to install on anything older —
      # so the oldest runner still supported is the one that produces the most usable binary.
      - name: Linux build dependencies
        if: matrix.os == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf

      - name: Add the target
        if: matrix.os == 'macos-latest'
        run: rustup target add aarch64-apple-darwin

      - uses: Swatinem/rust-cache@v2
        with:
          # Its own workspace, so its own cache key — sharing one with the root workspace
          # would evict the fast build's cache with several hundred Tauri crates.
          workspaces: desktop
          key: desktop-${{ matrix.os }}

      - uses: jetli/wasm-pack-action@v0.4.0
        with:
          version: 'v0.15.0'

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web/package-lock.json

      # The desktop build wraps `web/dist`; it does not produce it. Same files as the site.
      - name: Build the web app
        working-directory: web
        run: |
          npm ci
          npm run build

      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Signs the update manifest. Without these the build still succeeds and simply
          # produces no updater artifacts, which is the right failure: a missing secret should
          # not block a release, it should block auto-update.
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          projectPath: desktop
          args: ${{ matrix.args }}
          # Artifacts are collected and attached by the publish job below, so that every file
          # in a release arrives through one path rather than two.
          includeUpdaterJson: true
          uploadReleaseAssets: false

      - uses: actions/upload-artifact@v4
        with:
          name: kleene-desktop-${{ matrix.os }}
          path: |
            desktop/target/**/release/bundle/**/*.dmg
            desktop/target/**/release/bundle/**/*.app.tar.gz*
            desktop/target/**/release/bundle/**/*.deb
            desktop/target/**/release/bundle/**/*.AppImage*
            desktop/target/**/release/bundle/**/*.exe
            desktop/target/**/release/bundle/**/*.msi*
            desktop/target/**/release/bundle/**/*.json
          if-no-files-found: warn

  publish:
    name: Publish the release
    needs: [cli, web, desktop]
    # Only for a real tag. A workflow_dispatch run is a rehearsal: it proves the build and
    # stops short of creating anything public.
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: List what is being attached
        run: ls -lh artifacts

      - uses: softprops/action-gh-release@v2
        with:
          files: artifacts/*
          # Written by hand rather than generated from commit subjects. The commits read as
          # a build log, which is the right register for a contributor and the wrong one for
          # someone deciding whether to download this.
          #
          # The whole file, which is right for v1.0.0 and wrong afterwards — trim it to the
          # new section while the release is still a draft.
          body_path: CHANGELOG.md
          generate_release_notes: false
          draft: true
