name: CI

on:
  push:
    branches: [main]
  pull_request:

# A superseded run on the same branch is wasted minutes and a slower signal.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  # Debug symbols are the bulk of the target dir and nothing here reads a backtrace.
  CARGO_PROFILE_DEV_DEBUG: 0

jobs:
  rust:
    name: Rust
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # No toolchain is named here on purpose: rust-toolchain.toml pins it, so CI and a
      # developer's machine cannot drift into disagreeing about the compiler.
      - name: Show toolchain
        run: rustc --version && cargo --version

      - uses: Swatinem/rust-cache@v2

      - name: Format
        run: cargo fmt --all --check

      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Test
        run: cargo test --workspace

      # Generated files are committed so the web build never needs a Rust toolchain. That
      # only works if they cannot drift: a generated file out of step with its source is
      # worse than a hand-written one, because it carries a promise it is not keeping.
      - name: TypeScript bindings are up to date
        run: |
          ./scripts/generate-types.sh
          git diff --exit-code -- web/src/model/generated \
            || { echo "::error::Generated types are stale. Run ./scripts/generate-types.sh and commit."; exit 1; }

      # The property suite runs at 256 cases under a normal `cargo test` so local runs stay
      # fast, and at the 10,000 the roadmap asks for here. Release mode because that is
      # 160,000 generated cases across sixteen properties — about 3 seconds optimised, and
      # minutes without.
      - name: Property tests at 10k cases
        env:
          PROPTEST_CASES: 10000
        run: |
          cargo test --release -p kleene-core --test properties
          cargo test --release -p kleene-core --test differential

  wasm:
    name: WebAssembly
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: Swatinem/rust-cache@v2

      - uses: jetli/wasm-pack-action@v0.4.0
        with:
          # Pinned deliberately. wasm-pack supplies its own binaryen, and the wasm-opt
          # feature flags in crates/kleene-wasm/Cargo.toml are only valid for the version
          # it ships — binaryen 119+ renamed the bulk-memory flags incompatibly.
          version: 'v0.15.0'

      - name: Build
        run: wasm-pack build crates/kleene-wasm --target web --out-dir pkg --release

      - name: Size budget
        run: node scripts/check-wasm-size.mjs

      - name: Upload for the web job
        uses: actions/upload-artifact@v4
        with:
          name: wasm-pkg
          path: crates/kleene-wasm/pkg
          retention-days: 1

  web:
    name: Web
    runs-on: ubuntu-latest
    needs: wasm
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web/package-lock.json

      # Reuses the wasm the previous job already built and size-checked, rather than
      # rebuilding it with a second Rust toolchain install.
      - uses: actions/download-artifact@v4
        with:
          name: wasm-pkg
          path: crates/kleene-wasm/pkg

      - run: npm ci

      - name: Lint
        run: npx eslint .

      - name: Format
        run: npx prettier --check .

      - name: Typecheck
        run: npx tsc -b --noEmit

      - name: Test
        run: npx vitest run

      # `npm run build` would re-run wasm-pack; the artifact is already here.
      - name: Build
        run: npx vite build

      - name: No known vulnerabilities
        run: npm audit --audit-level=high
