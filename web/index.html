<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>Kleene — automata theory workbench</title>
    <meta
      name="description"
      content="Draw an automaton or type a regular expression, then watch the conversion happen one step at a time. Export to TikZ, share by link, works offline."
    />

    <!--
      Applied before first paint so a dark-mode user never sees a white flash. It has to be
      inline and synchronous; a module import would run after the first frame.
    -->
    <script>
      try {
        var t = localStorage.getItem('kleene.theme');
        if (t === 'light' || t === 'dark')
          document.documentElement.setAttribute('data-theme', t);
      } catch (e) {
        /* blocked storage is not worth failing over */
      }
    </script>

    <meta name="theme-color" content="#6d5ef8" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#0f1117" media="(prefers-color-scheme: dark)" />

    <!--
      An SVG favicon, with no .ico fallback. Every browser released since 2020 takes one, and
      the ones that do not get the default — which is the same outcome as shipping no icon at
      all, for none of the work of maintaining a raster set.
    -->
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />

    <!--
      The link preview. Kleene is distributed by people pasting URLs at each other
      (roadmap §6.4), so a link with no card is a wasted one — and a link with a *wrong* card
      is worse. The image is generated by rendering a real page and screenshotting it
      (`npm run og`), so it cannot drift away from the design it claims to show.
    -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Kleene" />
    <meta property="og:title" content="Automata theory you can watch happen" />
    <meta
      property="og:description"
      content="Draw an automaton or type a regular expression, then watch the conversion happen one step at a time. Free, no account, nothing uploaded."
    />
    <meta property="og:image" content="/og.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />

    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Automata theory you can watch happen" />
    <meta
      name="twitter:description"
      content="Draw an automaton or type a regular expression, then watch the conversion happen one step at a time."
    />
    <meta name="twitter:image" content="/og.png" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
